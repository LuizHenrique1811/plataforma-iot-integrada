asyncapi: 3.1.0
info:
  title: Plataforma IoT Integrada - interface MQTT
  version: 1.0.0
  description: |
    Tópicos MQTT da plataforma (seção 4.5 do documento de requisitos). A mesma convenção vale
    para a instância central e para os nós de borda: os dispositivos não percebem a diferença.

    O payload de todos os tópicos é a mensagem canônica (json-schema/mensagem-canonica-1.0.json).
    Os níveis do tópico precisam corresponder à mensagem: o nível `dispositivo` é igual ao campo
    `dispositivo`. Qualquer cliente MQTT 3.1.1 ou 5.0 que monte esse JSON integra (RF-INT-02).
  license:
    name: Uso acadêmico
defaultContentType: application/json

servers:
  central:
    host: localhost:1883
    protocol: mqtt
    description: Broker da instância central.
  borda:
    host: localhost:1884
    protocol: mqtt
    description: Broker de um nó de borda; guarda e sincroniza quando o link volta.

channels:
  telemetria:
    address: '{inquilino}/{site}/{dominio}/{dispositivo}/telemetria'
    description: Medições do dispositivo (dispositivo -> plataforma).
    parameters:
      inquilino:
        $ref: '#/components/parameters/inquilino'
      site:
        $ref: '#/components/parameters/site'
      dominio:
        $ref: '#/components/parameters/dominio'
      dispositivo:
        $ref: '#/components/parameters/dispositivo'
    messages:
      telemetria:
        $ref: '#/components/messages/telemetria'
  evento:
    address: '{inquilino}/{site}/{dominio}/{dispositivo}/evento'
    description: Ocorrências do dispositivo ou de regras locais da borda (dispositivo -> plataforma).
    parameters:
      inquilino:
        $ref: '#/components/parameters/inquilino'
      site:
        $ref: '#/components/parameters/site'
      dominio:
        $ref: '#/components/parameters/dominio'
      dispositivo:
        $ref: '#/components/parameters/dispositivo'
    messages:
      evento:
        $ref: '#/components/messages/evento'
  estado:
    address: '{inquilino}/{site}/{dominio}/{dispositivo}/estado'
    description: Estado relatado pelo dispositivo, base do gêmeo (dispositivo -> plataforma).
    parameters:
      inquilino:
        $ref: '#/components/parameters/inquilino'
      site:
        $ref: '#/components/parameters/site'
      dominio:
        $ref: '#/components/parameters/dominio'
      dispositivo:
        $ref: '#/components/parameters/dispositivo'
    messages:
      estado:
        $ref: '#/components/messages/estado'
  comando:
    address: '{inquilino}/{site}/{dominio}/{dispositivo}/comando'
    description: Comandos da plataforma para o dispositivo (plataforma -> dispositivo).
    parameters:
      inquilino:
        $ref: '#/components/parameters/inquilino'
      site:
        $ref: '#/components/parameters/site'
      dominio:
        $ref: '#/components/parameters/dominio'
      dispositivo:
        $ref: '#/components/parameters/dispositivo'
    messages:
      comando:
        $ref: '#/components/messages/comando'

operations:
  receberTelemetria:
    action: receive
    summary: A plataforma recebe a telemetria publicada pelo dispositivo.
    channel:
      $ref: '#/channels/telemetria'
    messages:
      - $ref: '#/channels/telemetria/messages/telemetria'
  receberEvento:
    action: receive
    summary: A plataforma recebe eventos, inclusive os gerados por regras locais da borda.
    channel:
      $ref: '#/channels/evento'
    messages:
      - $ref: '#/channels/evento/messages/evento'
  receberEstado:
    action: receive
    summary: A plataforma recebe o estado relatado pelo dispositivo.
    channel:
      $ref: '#/channels/estado'
    messages:
      - $ref: '#/channels/estado/messages/estado'
  enviarComando:
    action: send
    summary: A plataforma publica um comando para o dispositivo.
    channel:
      $ref: '#/channels/comando'
    messages:
      - $ref: '#/channels/comando/messages/comando'

components:
  parameters:
    inquilino:
      description: Inquilino dono do dispositivo (secretaria, cooperativa ou fazenda).
      examples: [semma, coop-cerrado]
    site:
      description: Local do inquilino (bairro, campus, fazenda).
      examples: [centro, fazenda-boa-vista]
    dominio:
      description: Domínio do catálogo do inquilino. Configurável, sem lista fixa (RF-CEN-01).
      examples: [ambiente, agricultura, recursos_hidricos]
    dispositivo:
      description: Identificador do dispositivo; igual ao campo `dispositivo` da mensagem.
      examples: [ar-centro-03, solo-talhao07-02]
  messages:
    telemetria:
      name: telemetria
      title: Telemetria
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $ref: './json-schema/mensagem-canonica-1.0.json'
      examples:
        - name: rural-via-borda
          summary: Exemplo da seção 4.4 do documento.
          payload:
            versao: '1.0'
            id_mensagem: b6d1e0c4-5f7a-4c2e-9d13-8a2f61c0e9b7
            dispositivo: solo-talhao07-02
            tipo: telemetria
            timestamp: '2026-10-19T05:10:00Z'
            via: borda-fazenda-boa-vista
            local:
              site: fazenda-boa-vista
              area: talhao-07
              geo:
                type: Point
                coordinates: [-49.1012, -16.4123]
            medidas:
              - grandeza: umidade_solo
                valor: 23.5
                unidade: '%'
              - grandeza: temperatura_solo
                valor: 21.8
                unidade: Cel
    evento:
      name: evento
      title: Evento
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $ref: './json-schema/mensagem-canonica-1.0.json'
    estado:
      name: estado
      title: Estado relatado
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $ref: './json-schema/mensagem-canonica-1.0.json'
    comando:
      name: comando
      title: Comando
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $ref: './json-schema/mensagem-canonica-1.0.json'
