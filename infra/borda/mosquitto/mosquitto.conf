# Mosquitto do nó de borda (RF-EDG-01).
# Pendente (semana 2): listener TLS na porta 8883 (RF-ING-01, RNF-11), autenticação por dispositivo
# e ACL restringindo cada dispositivo aos próprios tópicos (RF-SEG-04).
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
# Na borda, quedas de energia são esperadas: gravar com frequência (RNF-07, RNF-10, ADR-0016).
autosave_interval 30

# Fila por cliente com sessão persistente; o padrão (1000) é pouco para rajadas.
max_queued_messages 100000

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
