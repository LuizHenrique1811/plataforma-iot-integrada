# Nó de borda da Plataforma IoT Integrada (ADR-0006).
# Uso: copie .env.example para .env, gere a chave da fila e rode `docker compose up -d --build` nesta pasta.
# As portas são diferentes das da central para os dois ambientes rodarem na mesma máquina.
name: iot-borda

services:
  # Ingestão MQTT local (RF-EDG-01). Dispositivos e simuladores publicam aqui.
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:1884:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-dados:/mosquitto/data

  # servico-core no papel borda: a mesma imagem da central (ADR-0006), com fila SQLite cifrada,
  # regras locais e sincronização em lotes com a central.
  servico-core:
    image: plataforma-iot/servico-core:dev
    build:
      context: ../..
      dockerfile: servico-core/Dockerfile
      target: final
    restart: unless-stopped
    environment:
      PAPEL: borda
      BORDA_ID: ${BORDA_ID:?Defina BORDA_ID no arquivo .env}
      BANCO_URL: sqlite:////dados/borda.db
      CHAVE_FILA_ARQUIVO: /run/secrets/chave_fila          # chave fora do volume de dados (ADR-0014)
      CHAVE_ADMIN: ${CHAVE_ADMIN:?Defina CHAVE_ADMIN no arquivo .env}
      CENTRAL_URL: http://central:8000                     # nome da central na rede iot-link
      CHAVE_CENTRAL: ${CHAVE_CENTRAL:-}                    # chave de papel no_borda emitida pela central
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENTE: servico-core-borda
      SINCRONIZACAO_S: ${SINCRONIZACAO_S:-5}
      LOG_NIVEL: ${LOG_NIVEL:-INFO}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8001:8000"                 # API local, inclusive ingestão HTTP (RF-EDG-01)
    volumes:
      - servico-core-dados:/dados
    secrets:
      - chave_fila
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - link                                               # desconectar esta rede simula o corte de link
    depends_on:
      - mosquitto

volumes:
  mosquitto-dados:
  servico-core-dados:

networks:
  link:
    name: iot-link
    external: true

secrets:
  chave_fila:
    file: ${CHAVE_FILA_ARQUIVO:-./segredos/chave-fila}
