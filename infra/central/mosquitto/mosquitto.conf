# Mosquitto da central (ADR-0007).
# Pendente (semana 2): listener TLS na porta 8883 (RF-ING-01, RNF-11), autenticação por dispositivo
# e ACL restringindo cada dispositivo aos próprios tópicos (RF-SEG-04).
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
# Grava o estado em disco a cada 30 s (o padrão é 30 min), reduzindo a janela de perda de
# mensagens já confirmadas se o broker cair (RNF-10, ADR-0016). Ajustar nos testes de carga.
autosave_interval 30

# Fila por cliente com sessão persistente. O padrão (1000) se esgota em 1 s a 1.000 msg/s (RNF-01).
max_queued_messages 100000

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
