# Ambiente central da Plataforma IoT Integrada (ADR-0006, ADR-0007).
# Uso: copie .env.example para .env, preencha as senhas e rode `docker compose up -d` nesta pasta.
name: iot-central

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-dados:/mosquitto/data

  # Séries temporais, catálogo e último estado (ADR-0017). As extensões são criadas pelas migrações do servico-core.
  # Use a imagem sem sufixo -oss: os continuous aggregates (ADR-0013) não existem na variante -oss.
  # PostGIS fica para depois; para ativá-lo, troque pela imagem timescale/timescaledb-ha (ADR-0007).
  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5432:5432"
    volumes:
      - timescaledb-dados:/var/lib/postgresql/data
      - pg-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.4.13
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD no arquivo .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Lidas pelo provisionamento da fonte de dados TimescaleDB (infra/grafana/provisioning).
      # Pendente: trocar por um usuário somente leitura quando o esquema existir.
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-dados:/var/lib/grafana
    depends_on:
      - timescaledb

  # servico-core no papel central. É a mesma imagem da borda (ADR-0006).
  servico-core: &servico-core
    image: plataforma-iot/servico-core:dev
    build:
      context: ../..
      dockerfile: servico-core/Dockerfile
      target: final
    restart: unless-stopped
    environment: &ambiente-core
      PAPEL: central
      # Socket Unix do PostgreSQL, no mesmo servidor: menos CPU por consulta que TCP (ADR-0022).
      BANCO_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@/${POSTGRES_DB:-iot}?host=/var/run/postgresql
      CHAVE_ADMIN: ${CHAVE_ADMIN:?Defina CHAVE_ADMIN no arquivo .env}
      LOG_NIVEL: ${LOG_NIVEL:-INFO}
      # Ingestão MQTT com sessão persistente: o broker guarda as mensagens se o serviço reiniciar.
      # O grupo divide as mensagens entre este serviço e as réplicas do perfil "escala" (ADR-0022).
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENTE: servico-core-central
      MQTT_GRUPO: ingestao
    volumes:
      - pg-socket:/var/run/postgresql
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"   # API, Swagger UI (ADR-0019) e /metrics (RF-OBS-01)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    # Rede iot-link, compartilhada com a borda, que encontra a central pelo nome "central".
    networks:
      default:
      link:
        aliases: [central]

  # Réplicas de ingestão no mesmo servidor, para a carga de 1.000 msg/s (RNF-01, RNF-09, ADR-0022):
  #   docker compose --profile escala up -d --wait
  # Cada uma usa sessão limpa (uma réplica parada sai do grupo e não segura mensagens), um MQTT_CLIENTE
  # próprio e não verifica ausências: só o servico-core principal, de sessão persistente, faz isso.
  # Sem portas publicadas. Para voltar a um processo só: docker compose --profile escala stop
  ingestao-2: &replica
    <<: *servico-core
    profiles: [escala]
    environment:
      <<: *ambiente-core
      MQTT_CLIENTE: servico-core-central-2
      VERIFICACAO_AUSENCIA_S: "0"
      MQTT_SESSAO_PERSISTENTE: "0"
    ports: []
    networks: [default]
  ingestao-3:
    <<: *replica
    environment:
      <<: *ambiente-core
      MQTT_CLIENTE: servico-core-central-3
      VERIFICACAO_AUSENCIA_S: "0"
      MQTT_SESSAO_PERSISTENTE: "0"
  ingestao-4:
    <<: *replica
    environment:
      <<: *ambiente-core
      MQTT_CLIENTE: servico-core-central-4
      VERIFICACAO_AUSENCIA_S: "0"
      MQTT_SESSAO_PERSISTENTE: "0"
  ingestao-5:
    <<: *replica
    environment:
      <<: *ambiente-core
      MQTT_CLIENTE: servico-core-central-5
      VERIFICACAO_AUSENCIA_S: "0"
      MQTT_SESSAO_PERSISTENTE: "0"
  ingestao-6:
    <<: *replica
    environment:
      <<: *ambiente-core
      MQTT_CLIENTE: servico-core-central-6
      VERIFICACAO_AUSENCIA_S: "0"
      MQTT_SESSAO_PERSISTENTE: "0"
  ingestao-7:
    <<: *replica
    environment:
      <<: *ambiente-core
      MQTT_CLIENTE: servico-core-central-7
      VERIFICACAO_AUSENCIA_S: "0"
      MQTT_SESSAO_PERSISTENTE: "0"
  ingestao-8:
    <<: *replica
    environment:
      <<: *ambiente-core
      MQTT_CLIENTE: servico-core-central-8
      VERIFICACAO_AUSENCIA_S: "0"
      MQTT_SESSAO_PERSISTENTE: "0"
  ingestao-9:
    <<: *replica
    environment:
      <<: *ambiente-core
      MQTT_CLIENTE: servico-core-central-9
      VERIFICACAO_AUSENCIA_S: "0"
      MQTT_SESSAO_PERSISTENTE: "0"
  ingestao-10:
    <<: *replica
    environment:
      <<: *ambiente-core
      MQTT_CLIENTE: servico-core-central-10
      VERIFICACAO_AUSENCIA_S: "0"
      MQTT_SESSAO_PERSISTENTE: "0"

volumes:
  mosquitto-dados:
  pg-socket:
  timescaledb-dados:
  grafana-dados:

# Rede compartilhada com a borda, por onde passa a sincronização em lotes. Criada uma vez, fora dos
# projetos, para central e borda subirem independentes: docker network create iot-link
networks:
  link:
    name: iot-link
    external: true
